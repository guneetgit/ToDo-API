<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do App</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #f0f2f5; display: flex; justify-content: center; padding: 40px 20px; }
    .container { background: white; border-radius: 12px; padding: 30px; width: 100%; max-width: 500px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
    h1 { text-align: center; margin-bottom: 24px; color: #1a1a2e; font-size: 24px; }
    .form-group { margin-bottom: 12px; }
    input, textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; outline: none; }
    input:focus, textarea:focus { border-color: #4a90e2; }
    textarea { resize: none; height: 80px; }
    button.primary-btn { width: 100%; padding: 12px; background: #4a90e2; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 4px; }
    button.primary-btn:hover { background: #357abd; }
    .divider { border: none; border-top: 1px solid #eee; margin: 24px 0; }
    .task-list { display: flex; flex-direction: column; gap: 12px; }
    .task-card { background: #f8f9fa; border-radius: 8px; padding: 16px; border-left: 4px solid #4a90e2; }
    .task-card.completed { border-left-color: #27ae60; opacity: 0.7; }
    .task-title { font-size: 16px; font-weight: bold; color: #1a1a2e; margin-bottom: 4px; }
    .task-card.completed .task-title { text-decoration: line-through; color: #888; }
    .task-desc { font-size: 13px; color: #666; margin-bottom: 12px; }
    .task-actions { display: flex; gap: 8px; }
    .btn-complete { padding: 6px 14px; background: #27ae60; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; }
    .btn-delete { padding: 6px 14px; background: #e74c3c; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; }
    .btn-complete:hover { background: #219a52; }
    .btn-delete:hover { background: #c0392b; }
    .empty-msg { text-align: center; color: #aaa; font-size: 14px; padding: 20px 0; }
    .status-msg { text-align: center; font-size: 13px; margin-top: 8px; color: #27ae60; min-height: 20px; }
    .auth-toggle { text-align: center; margin-top: 12px; font-size: 13px; color: #4a90e2; cursor: pointer; }
    .auth-toggle:hover { text-decoration: underline; }
    .logout-btn { width: 100%; padding: 8px; background: transparent; border: 1px solid #e74c3c; color: #e74c3c; border-radius: 8px; font-size: 13px; cursor: pointer; margin-bottom: 16px; }
    .logout-btn:hover { background: #fdf0f0; }
    .welcome { text-align: center; font-size: 13px; color: #666; margin-bottom: 12px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>My To-Do List</h1>

    <!-- AUTH SECTION -->
    <div id="authSection">
      <div id="loginForm">
        <div class="form-group">
          <input type="email" id="loginEmail" placeholder="Email..." />
        </div>
        <div class="form-group">
          <input type="password" id="loginPassword" placeholder="Password..." />
        </div>
        <button class="primary-btn" onclick="login()">Login</button>
        <p class="auth-toggle" onclick="showSignup()">Don't have an account? Sign up</p>
        <p class="status-msg" id="authMsg"></p>
      </div>

      <div id="signupForm" style="display:none;">
        <div class="form-group">
          <input type="text" id="signupName" placeholder="Full name..." />
        </div>
        <div class="form-group">
          <input type="email" id="signupEmail" placeholder="Email..." />
        </div>
        <div class="form-group">
          <input type="password" id="signupPassword" placeholder="Password (min 6 characters)..." />
        </div>
        <button class="primary-btn" onclick="signup()">Sign Up</button>
        <p class="auth-toggle" onclick="showLogin()">Already have an account? Login</p>
        <p class="status-msg" id="signupMsg"></p>
      </div>
    </div>

    <!-- TASKS SECTION -->
    <div id="tasksSection" style="display:none;">
      <p class="welcome" id="welcomeMsg"></p>
      <button class="logout-btn" onclick="logout()">Logout</button>

      <div class="form-group">
        <input type="text" id="titleInput" placeholder="Task title..." />
      </div>
      <div class="form-group">
        <textarea id="descInput" placeholder="Description (optional)..."></textarea>
      </div>
      <button class="primary-btn" onclick="createTask()">Add Task</button>
      <p class="status-msg" id="statusMsg"></p>

      <hr class="divider">

      <div class="task-list" id="taskList">
        <p class="empty-msg">Loading tasks...</p>
      </div>
    </div>
  </div>

  <script>
    const API = 'http://localhost:3000';
    let token = localStorage.getItem('token');
    let userName = localStorage.getItem('userName');

    // check if already logged in
    if (token) {
      showTasksSection();
      getTasks();
    }

    function showTasksSection() {
      document.getElementById('authSection').style.display = 'none';
      document.getElementById('tasksSection').style.display = 'block';
      document.getElementById('welcomeMsg').textContent = `Welcome back, ${userName}!`;
    }

    function showSignup() {
      document.getElementById('loginForm').style.display = 'none';
      document.getElementById('signupForm').style.display = 'block';
    }

    function showLogin() {
      document.getElementById('signupForm').style.display = 'none';
      document.getElementById('loginForm').style.display = 'block';
    }

    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('userName');
      token = null;
      document.getElementById('authSection').style.display = 'block';
      document.getElementById('tasksSection').style.display = 'none';
      showLogin();
    }

    async function signup() {
      const name = document.getElementById('signupName').value.trim();
      const email = document.getElementById('signupEmail').value.trim();
      const password = document.getElementById('signupPassword').value.trim();

      if (!name || !email || !password) {
        showAuthMsg('Please fill all fields', 'red');
        return;
      }

      try {
        const res = await fetch(`${API}/auth/signup`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password })
        });
        const data = await res.json();

        if (!res.ok) {
          showAuthMsg(data.message, 'red');
          return;
        }

        token = data.token;
        userName = data.user.name;
        localStorage.setItem('token', token);
        localStorage.setItem('userName', userName);
        showTasksSection();
        getTasks();

      } catch (error) {
        showAuthMsg('Could not connect to server', 'red');
      }
    }

    async function login() {
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value.trim();

      if (!email || !password) {
        showAuthMsg('Please fill all fields', 'red');
        return;
      }

      try {
        const res = await fetch(`${API}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (!res.ok) {
          showAuthMsg(data.message, 'red');
          return;
        }

        token = data.token;
        userName = data.user.name;
        localStorage.setItem('token', token);
        localStorage.setItem('userName', userName);
        showTasksSection();
        getTasks();

      } catch (error) {
        showAuthMsg('Could not connect to server', 'red');
      }
    }

    async function getTasks() {
      try {
        const res = await fetch(`${API}/tasks`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const tasks = await res.json();
        const taskList = document.getElementById('taskList');

        if (tasks.length === 0) {
          taskList.innerHTML = '<p class="empty-msg">No tasks yet. Add one above!</p>';
          return;
        }

        taskList.innerHTML = tasks.map(task => `
          <div class="task-card ${task.completed ? 'completed' : ''}">
            <div class="task-title">${task.title}</div>
            <div class="task-desc">${task.description || 'No description'}</div>
            <div class="task-actions">
              ${!task.completed ? `<button class="btn-complete" onclick="completeTask('${task._id}')">Mark Complete</button>` : ''}
              <button class="btn-delete" onclick="deleteTask('${task._id}')">Delete</button>
            </div>
          </div>
        `).join('');

      } catch (error) {
        document.getElementById('taskList').innerHTML = '<p class="empty-msg">Could not load tasks.</p>';
      }
    }

    async function createTask() {
      const title = document.getElementById('titleInput').value.trim();
      const description = document.getElementById('descInput').value.trim();

      if (!title) { showStatus('Please enter a title', 'red'); return; }

      try {
        await fetch(`${API}/tasks`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ title, description })
        });
        document.getElementById('titleInput').value = '';
        document.getElementById('descInput').value = '';
        showStatus('Task added!', '#27ae60');
        getTasks();
      } catch (error) {
        showStatus('Failed to add task', 'red');
      }
    }

    async function completeTask(id) {
      try {
        await fetch(`${API}/tasks/${id}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ completed: true })
        });
        getTasks();
      } catch (error) {
        showStatus('Failed to update task', 'red');
      }
    }

    async function deleteTask(id) {
      try {
        await fetch(`${API}/tasks/${id}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${token}` }
        });
        getTasks();
      } catch (error) {
        showStatus('Failed to delete task', 'red');
      }
    }

    function showStatus(msg, color) {
      const el = document.getElementById('statusMsg');
      el.textContent = msg;
      el.style.color = color;
      setTimeout(() => el.textContent = '', 2000);
    }

    function showAuthMsg(msg, color) {
      const el = document.getElementById('authMsg') || document.getElementById('signupMsg');
      el.textContent = msg;
      el.style.color = color;
    }
  </script>
</body>
</html>
